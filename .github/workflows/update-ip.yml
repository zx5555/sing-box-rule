name: Update IP

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: Update IP
        run: |
          DATA=$(curl -s -A "Mozilla/5.0" --max-time 10 https://ip.v2too.top/api/nodes)

          echo "接口返回："
          echo "$DATA"

          if echo "$DATA" | jq -e 'type=="array"' > /dev/null 2>&1; then
            IPS=$(echo "$DATA" | jq -r '.[].ip' | sort -u)

            if [ -n "$IPS" ]; then
              echo "$IPS" > ip.txt
              echo "更新成功"
            else
              echo "IP为空，跳过"
            fi
          else
            echo "接口返回异常"
            exit 0
          fi

      - name: 提交变更
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add ip.txt
          git diff --quiet && echo "无变化" && exit 0
          git commit -m "自动更新 IP"
          git push
