name: Update  IP

on:
  schedule:
    - cron: "*/30 * * * *"   # 每30分钟更新一次
  workflow_dispatch:        # 支持手动触发

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 获取 IP 并写入文件
        run: |
          curl -s https://ip.v2too.top/api/nodes \
          | jq -r '.[].ip' > ip.txt

      - name: 提交变更
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add ip.txt
          git commit -m "自动更新  IP" || echo "无变化"
          git push
